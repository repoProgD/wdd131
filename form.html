<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131- Dynamic Web Fundamentals - Form</title>
    <meta name="author" content="Diego Ledesma">
    <meta name="description" content="WDD 131 - Dynamic Web Fundamentals course W06 assignment by Diego Ledesma.">


    <link rel="stylesheet" href="styles/form.css">

    <!-- Google Fonts (Lora & Roboto)-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400..700&family=Roboto:wght@100..900&display=swap"
        rel="stylesheet">

    <script src="scripts/form-array.js" defer></script>
    <script src="scripts/form-storing.js" defer></script>
    <script src="scripts/getdates.js" defer></script>

</head>

<body>
    <header>
        <h1 class="header-title">Product Review</h1>
    </header>

   
        <form method="get" action="review.html">
            <label for="product">Product Name:</label>
            <select name="product" id="product" required>
                <option value="" disabled selected>Choose a product</option>
            </select>

            <!-- Overall Rating -->
            <fieldset class="rating">
                <legend>Overall Rating</legend>
                <label class="rating-label">
                    <span>1⭐</span>
                    <input type="radio" name="rating" id="rating1" value="1" required>
                </label>
                <label class="rating-label">
                    <span>2⭐</span>
                    <input type="radio" name="rating" id="rating2" value="2">
                </label>
                <label class="rating-label">
                    <span>3⭐</span>
                    <input type="radio" name="rating" id="rating3" value="3">
                </label>
                <label class="rating-label">
                    <span>4⭐</span>
                    <input type="radio" name="rating" id="rating4" value="4">
                </label>
                <label class="rating-label">
                    <span>5⭐</span>
                    <input type="radio" name="rating" id="rating5" value="5">
                </label>
            </fieldset>

            <!-- Date -->
            <label for="date">Date:</label>
            <input type="date" name="date" id="date" required>


            <!-- Features -->
            <fieldset>
                <legend>Which features did you find useful in the product?</legend>
                <label><input type="checkbox" name="features" id="f1" value="feature1">Durability</label>
                <label><input type="checkbox" name="features" id="f2" value="feature2">Ease of Use</label>
                <label><input type="checkbox" name="features" id="f3" value="feature3">Performance</label>
                <label><input type="checkbox" name="features" id="f4" value="feature4">Design</label>
            </fieldset>

            <!-- Written Review -->

            <label for="review">Written Review (optional)</label>
            <textarea name="review" id="review"></textarea>

            <!-- Your Name -->
            <label for="customer">Your Name (optional)</label>
            <input type="text" name="customer" id="customer">

            <button type="submit">Send Review</button>

        </form>

    

    <footer>
        <p> © <span id="currentyear"></span> | Diego Ledesma | Argentina</p>
        <p><span id="lastModified"></span></p>
    </footer>
</body>

</html>
